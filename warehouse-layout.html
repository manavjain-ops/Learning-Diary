<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warehouse Layout Creator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1d23;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: #23272f;
      border-bottom: 1px solid #333;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
    header h1 span { color: #5b9cf6; }

    .header-actions { margin-left: auto; display: flex; gap: 8px; }
    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn-ghost { background: transparent; color: #aaa; border: 1px solid #444; }
    .btn-ghost:hover { background: #333; color: #fff; }
    .btn-danger { background: #c0392b; color: #fff; }
    .btn-danger:hover { background: #e74c3c; }

    /* ── Layout ── */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    aside {
      width: 220px;
      background: #23272f;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .sidebar-section { padding: 14px; border-bottom: 1px solid #2e3340; }
    .sidebar-section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #777; margin-bottom: 10px; }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 10px;
      border-radius: 7px;
      border: 2px solid transparent;
      background: transparent;
      color: #ccc;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 4px;
      transition: background 0.15s, border-color 0.15s;
      text-align: left;
    }
    .tool-btn:hover { background: #2e3340; }
    .tool-btn.active { background: #2e3340; border-color: var(--tool-color); color: #fff; }

    .tool-swatch {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* ── Zone name input ── */
    .zone-name-wrap { padding: 14px; border-bottom: 1px solid #2e3340; }
    .zone-name-wrap h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #777; margin-bottom: 8px; }
    .zone-name-wrap input {
      width: 100%;
      padding: 7px 10px;
      background: #1a1d23;
      border: 1px solid #444;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
    }
    .zone-name-wrap input:focus { outline: none; border-color: #5b9cf6; }

    /* ── Grid size ── */
    .grid-size-wrap { padding: 14px; }
    .grid-size-wrap h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #777; margin-bottom: 8px; }
    .size-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .size-row label { font-size: 12px; color: #888; width: 48px; }
    .size-row input[type=range] { flex: 1; accent-color: #5b9cf6; }
    .size-row span { font-size: 12px; width: 28px; text-align: right; }
    .btn-apply { width: 100%; margin-top: 6px; background: #5b9cf6; color: #fff; border: none; border-radius: 6px; padding: 7px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-apply:hover { background: #4a8de0; }

    /* ── Legend ── */
    .legend { padding: 14px; border-top: 1px solid #2e3340; margin-top: auto; }
    .legend h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #777; margin-bottom: 8px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #aaa; margin-bottom: 5px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

    /* ── Canvas area ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 20px;
      background: #13151a;
    }

    #grid-wrapper {
      position: relative;
      cursor: crosshair;
      user-select: none;
    }

    #warehouse-canvas {
      display: block;
      border: 2px solid #3a3f4b;
      border-radius: 4px;
      image-rendering: pixelated;
    }

    /* Tooltip */
    #tooltip {
      position: fixed;
      background: #23272f;
      border: 1px solid #444;
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 11px;
      color: #aaa;
      pointer-events: none;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

<header>
  <h1>Warehouse <span>Layout Creator</span></h1>
  <div class="header-actions">
    <button class="btn btn-ghost" id="btn-undo">↩ Undo</button>
    <button class="btn btn-ghost" id="btn-redo">↪ Redo</button>
    <button class="btn btn-danger" id="btn-clear">Clear All</button>
  </div>
</header>

<div class="workspace">
  <aside>
    <div class="sidebar-section">
      <h2>Tools</h2>
      <button class="tool-btn active" data-tool="wall" style="--tool-color:#7f8c8d">
        <span class="tool-swatch" style="background:#7f8c8d"></span> Wall
      </button>
      <button class="tool-btn" data-tool="aisle" style="--tool-color:#5dade2">
        <span class="tool-swatch" style="background:#5dade2"></span> Aisle / Walkway
      </button>
      <button class="tool-btn" data-tool="dock" style="--tool-color:#e67e22">
        <span class="tool-swatch" style="background:#e67e22"></span> Loading Dock
      </button>
      <button class="tool-btn" data-tool="zone" style="--tool-color:#2ecc71">
        <span class="tool-swatch" style="background:#2ecc71"></span> Zone
      </button>
      <button class="tool-btn" data-tool="eraser" style="--tool-color:#e74c3c">
        <span class="tool-swatch" style="background:#e74c3c; border-style:dashed"></span> Eraser
      </button>
    </div>

    <div class="zone-name-wrap">
      <h2>Zone Label</h2>
      <input type="text" id="zone-label" placeholder="e.g. Receiving, Cold Storage" maxlength="20" />
    </div>

    <div class="grid-size-wrap">
      <h2>Grid Size</h2>
      <div class="size-row">
        <label>Cols</label>
        <input type="range" id="cols-range" min="10" max="60" value="30" />
        <span id="cols-val">30</span>
      </div>
      <div class="size-row">
        <label>Rows</label>
        <input type="range" id="rows-range" min="6" max="40" value="20" />
        <span id="rows-val">20</span>
      </div>
      <button class="btn-apply" id="btn-apply">Apply Grid Size</button>
    </div>

    <div class="legend">
      <h2>Legend</h2>
      <div class="legend-item"><span class="legend-dot" style="background:#7f8c8d"></span> Wall</div>
      <div class="legend-item"><span class="legend-dot" style="background:#5dade2"></span> Aisle / Walkway</div>
      <div class="legend-item"><span class="legend-dot" style="background:#e67e22"></span> Loading Dock</div>
      <div class="legend-item"><span class="legend-dot" style="background:#2ecc71"></span> Zone</div>
    </div>
  </aside>

  <main>
    <div id="grid-wrapper">
      <canvas id="warehouse-canvas"></canvas>
    </div>
  </main>
</div>

<div id="tooltip"></div>

<script>
(() => {
  // ── Config ──────────────────────────────────────────────────────────────
  const CELL = 28;          // px per grid cell
  const GRID_LINE = '#1e2128';
  const BG = '#23272f';
  const EMPTY = '';

  const COLORS = {
    wall:   '#7f8c8d',
    aisle:  '#5dade2',
    dock:   '#e67e22',
    zone:   '#2ecc71',
  };
  const ALPHA = {
    wall: 0.9, aisle: 0.75, dock: 0.9, zone: 0.45,
  };

  // ── State ────────────────────────────────────────────────────────────────
  let cols = 30, rows = 20;
  let grid = [];          // grid[r][c] = { type, label }
  let currentTool = 'wall';
  let painting = false;
  let history = [];       // undo stack (snapshots)
  let redoStack = [];

  const canvas = document.getElementById('warehouse-canvas');
  const ctx = canvas.getContext('2d');

  // ── Init ─────────────────────────────────────────────────────────────────
  function initGrid(c, r) {
    cols = c; rows = r;
    grid = Array.from({ length: rows }, () =>
      Array.from({ length: cols }, () => ({ type: EMPTY, label: '' }))
    );
    resizeCanvas();
    draw();
    saveSnapshot();
  }

  function resizeCanvas() {
    canvas.width  = cols * CELL;
    canvas.height = rows * CELL;
  }

  // ── Draw ─────────────────────────────────────────────────────────────────
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // background
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // cells
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = grid[r][c];
        if (cell.type && cell.type !== EMPTY) {
          const color = COLORS[cell.type];
          const alpha = ALPHA[cell.type];
          ctx.globalAlpha = alpha;
          ctx.fillStyle = color;
          ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
          ctx.globalAlpha = 1;

          // label for zones
          if (cell.type === 'zone' && cell.label) {
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${CELL >= 24 ? 9 : 7}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(
              cell.label.substring(0, 6),
              c * CELL + CELL / 2,
              r * CELL + CELL / 2
            );
          }

          // dock icon (arrow)
          if (cell.type === 'dock') {
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.font = `${CELL >= 24 ? 12 : 9}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('⬛', c * CELL + CELL / 2, r * CELL + CELL / 2);
          }
        }
      }
    }

    // grid lines
    ctx.strokeStyle = GRID_LINE;
    ctx.lineWidth = 0.5;
    for (let c = 0; c <= cols; c++) {
      ctx.beginPath();
      ctx.moveTo(c * CELL, 0);
      ctx.lineTo(c * CELL, rows * CELL);
      ctx.stroke();
    }
    for (let r = 0; r <= rows; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * CELL);
      ctx.lineTo(cols * CELL, r * CELL);
      ctx.stroke();
    }

    // outline border for wall cells (thicker border)
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (grid[r][c].type === 'wall') {
          ctx.strokeStyle = '#5d6d7e';
          ctx.lineWidth = 1;
          ctx.strokeRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
        }
      }
    }
  }

  // ── Paint ─────────────────────────────────────────────────────────────────
  function cellAt(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    return {
      c: Math.floor(x / CELL),
      r: Math.floor(y / CELL),
    };
  }

  function paintCell(e) {
    const { c, r } = cellAt(e);
    if (c < 0 || c >= cols || r < 0 || r >= rows) return;
    const cell = grid[r][c];

    if (currentTool === 'eraser') {
      cell.type  = EMPTY;
      cell.label = '';
    } else {
      cell.type = currentTool;
      if (currentTool === 'zone') {
        cell.label = document.getElementById('zone-label').value.trim();
      }
    }
    draw();
  }

  // ── History ───────────────────────────────────────────────────────────────
  function snapshot() {
    return grid.map(row => row.map(c => ({ ...c })));
  }

  function saveSnapshot() {
    history.push(snapshot());
    if (history.length > 80) history.shift();
    redoStack = [];
  }

  function undo() {
    if (history.length <= 1) return;
    redoStack.push(history.pop());
    grid = history[history.length - 1].map(row => row.map(c => ({ ...c })));
    draw();
  }

  function redo() {
    if (!redoStack.length) return;
    const next = redoStack.pop();
    history.push(next);
    grid = next.map(row => row.map(c => ({ ...c })));
    draw();
  }

  // ── Events ────────────────────────────────────────────────────────────────
  canvas.addEventListener('mousedown', e => {
    painting = true;
    saveSnapshot();
    paintCell(e);
  });
  canvas.addEventListener('mousemove', e => {
    if (painting) paintCell(e);

    // tooltip
    const { c, r } = cellAt(e);
    const tooltip = document.getElementById('tooltip');
    if (c >= 0 && c < cols && r >= 0 && r < rows) {
      const cell = grid[r][c];
      const label = cell.type
        ? `${cell.type}${cell.label ? ` — "${cell.label}"` : ''} [col ${c+1}, row ${r+1}]`
        : `Empty [col ${c+1}, row ${r+1}]`;
      tooltip.textContent = label;
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 12) + 'px';
      tooltip.style.top  = (e.clientY + 12) + 'px';
    }
  });
  window.addEventListener('mouseup', () => { painting = false; });
  canvas.addEventListener('mouseleave', () => {
    document.getElementById('tooltip').style.display = 'none';
  });

  // Tool buttons
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTool = btn.dataset.tool;
    });
  });

  // Undo / Redo
  document.getElementById('btn-undo').addEventListener('click', undo);
  document.getElementById('btn-redo').addEventListener('click', redo);

  // Clear
  document.getElementById('btn-clear').addEventListener('click', () => {
    if (!confirm('Clear the entire layout?')) return;
    saveSnapshot();
    grid.forEach(row => row.forEach(c => { c.type = EMPTY; c.label = ''; }));
    draw();
  });

  // Grid size
  const colsRange = document.getElementById('cols-range');
  const rowsRange = document.getElementById('rows-range');
  colsRange.addEventListener('input', () => { document.getElementById('cols-val').textContent = colsRange.value; });
  rowsRange.addEventListener('input', () => { document.getElementById('rows-val').textContent = rowsRange.value; });

  document.getElementById('btn-apply').addEventListener('click', () => {
    if (!confirm('Resizing will clear the current layout. Continue?')) return;
    history = []; redoStack = [];
    initGrid(+colsRange.value, +rowsRange.value);
  });

  // Keyboard shortcuts
  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); redo(); }
    const keyMap = { '1': 'wall', '2': 'aisle', '3': 'dock', '4': 'zone', 'e': 'eraser' };
    if (keyMap[e.key] && !e.ctrlKey && !e.metaKey) {
      document.querySelector(`[data-tool="${keyMap[e.key]}"]`).click();
    }
  });

  // ── Start ─────────────────────────────────────────────────────────────────
  initGrid(cols, rows);
})();
</script>
</body>
</html>
